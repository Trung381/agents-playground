version: '3.8'

services:
  voxa-callbot:
    build:
      context: .
      dockerfile: Dockerfile
      # Inject build-time environment variables for Next.js static asset compilation
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
        - NEXT_PUBLIC_APP_CONFIG=${NEXT_PUBLIC_APP_CONFIG}
    container_name: voxa-callbot
    restart: always
    expose:
      - "3000"
    # Runtime environment variables
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL}
    # Load env file local variables
    env_file:
      - .env.local

  auth-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: voxa-callbot-proxy
    restart: always
    ports:
      - "0.0.0.0:3000:80"
    environment:
      - VOXA_API_USERNAME=${VOXA_API_USERNAME:-trungvu}
      - VOXA_API_PASSWORD=${VOXA_API_PASSWORD:-Trung2004@}
    env_file:
      - .env.local
    depends_on:
      - voxa-callbot
